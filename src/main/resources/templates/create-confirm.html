<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登録の確認</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1 class="page-title">登録の確認</h1>

        <p>やること</p>
        <p class="confirm-value" th:text="${#strings.isEmpty(todo.title) ? '（入力なし）' : todo.title}"></p>

        <p>メモ</p>
        <p class="confirm-value" th:text="${#strings.isEmpty(todo.detail) ? '（入力なし）' : todo.detail}"></p>

        <p>ジャンル</p>
        <p class="confirm-value" th:text="${#strings.isEmpty(todo.category) ? '（入力なし）' : todo.category}"></p>

        <p>優先度</p>
        <p class="confirm-value"
           th:text="${todo.priority == 1 ? '高' : (todo.priority == 2 ? '中' : (todo.priority == 3 ? '低' : '（入力なし）'))}"></p>

        <p>期限</p>
        <p class="confirm-value" th:text="${todo.dueDate == null ? '（入力なし）' : todo.dueDate}"></p>

        <form method="post" th:action="@{/todos}" th:object="${todo}">
            <input type="hidden" th:field="*{title}">
            <input type="hidden" th:field="*{detail}">
            <input type="hidden" th:field="*{category}">
            <input type="hidden" th:field="*{priority}">
            <input type="hidden" th:field="*{dueDate}">

            <div class="confirm-actions">
                <button class="btn" type="submit">登録する</button>
                <button class="btn sub" type="submit" th:formaction="@{/todos/new}">書き直す</button>
            </div>
        </form>
    </div>
</body>
</html>
