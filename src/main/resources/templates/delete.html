<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>削除確認</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1 class="page-title">削除確認</h1>

        <p>やること</p>
        <p class="confirm-value" th:text="${todo.title}"></p>

        <p>ジャンル</p>
        <p class="confirm-value" th:text="${todo.category}"></p>

        <p>期限</p>
        <p class="confirm-value" th:text="${todo.dueDate == null ? '（入力なし）' : todo.dueDate}"></p>

        <div class="confirm-actions">
            <form method="post" th:action="@{/todos/{id}/delete(id=${todo.id})}">
                <button class="btn" type="submit">消す</button>
            </form>
            <a class="btn sub" th:href="@{/todos}">やめる</a>
        </div>
    </div>
</body>
</html>
