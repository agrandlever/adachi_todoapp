<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="|${calendarYear}年${calendarMonth}月のカレンダー|">カレンダー</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container calendar-container">
        <h1 class="page-title" th:text="|${calendarYear}年${calendarMonth}月|">カレンダー</h1>

        <section class="calendar-card" aria-label="月間カレンダー">
            <nav class="calendar-navigation" aria-label="月の切り替え">
                <a class="btn sub" th:href="@{/calendar(year=${previousYear}, month=${previousMonth})}">前の月</a>
                <a class="btn sub" th:href="@{/calendar(year=${nextYear}, month=${nextMonth})}">次の月</a>
            </nav>

            <div class="calendar-table-wrapper">
                <table class="calendar-table" th:attr="data-from=${firstDate},data-to=${lastDate}">
                    <thead>
                        <tr>
                            <th scope="col">日</th>
                            <th scope="col">月</th>
                            <th scope="col">火</th>
                            <th scope="col">水</th>
                            <th scope="col">木</th>
                            <th scope="col">金</th>
                            <th scope="col">土</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="week : ${calendarWeeks}">
                            <td th:each="date : ${week}" th:attr="data-date=${date}">
                                <span class="calendar-date" th:if="${date != null}" th:text="${date.dayOfMonth}"></span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
    <script>
        async function loadTodos() {
            const calendarTable = document.querySelector(".calendar-table");
            // 表に付いている月初と月末を、APIの検索条件にそのまま使います。
            const from = calendarTable.dataset.from;
            const to = calendarTable.dataset.to;
            const params = new URLSearchParams({ from, to });

            const res = await fetch(`/api/todos?${params.toString()}`);
            if (!res.ok) {
                return;
            }

            const todos = await res.json();
            // data-dateがある升目だけを集めるため、月の外の空きマスは入りません。
            const cellsByDate = new Map(
                Array.from(
                    calendarTable.querySelectorAll("td[data-date]"),
                    cell => [cell.dataset.date, cell]
                )
            );

            for (const todo of todos) {
                const cell = cellsByDate.get(todo.dueDate);
                if (!cell) {
                    continue;
                }

                const title = document.createElement("div");
                // textContentを使い、やることの名前だけを文字として追加します。
                title.textContent = todo.title;
                cell.appendChild(title);
            }
        }

        async function loadHolidays() {
            const calendarTable = document.querySelector(".calendar-table");
            // やることの取得と同じ月初・月末を、祝日の検索条件にも使います。
            const from = calendarTable.dataset.from;
            const to = calendarTable.dataset.to;
            const params = new URLSearchParams({ from, to });
            const cells = calendarTable.querySelectorAll("td[data-date]");

            for (const cell of cells) {
                // 年・月・日に分けて日付を作り、その日の曜日を調べます。
                const [year, month, day] = cell.dataset.date.split("-").map(Number);
                const dayOfWeek = new Date(year, month - 1, day).getDay();

                if (dayOfWeek === 6) {
                    cell.style.backgroundColor = "#eaf4ff";
                } else if (dayOfWeek === 0) {
                    cell.style.backgroundColor = "#fff0f3";
                }
            }

            const res = await fetch(`/api/holidays?${params.toString()}`);
            if (res.headers.has("X-Holidays-Unavailable")) {
                const message = document.createElement("p");
                message.textContent = "祝日を取れませんでした";
                document.body.prepend(message);
            }

            if (!res.ok) {
                return;
            }

            const holidays = await res.json();
            for (const [date, holidayName] of Object.entries(holidays)) {
                const cell = calendarTable.querySelector(`td[data-date="${date}"]`);
                if (!cell) {
                    continue;
                }

                // 祝日が土日と重なる場合は、祝日の背景色を優先します。
                cell.style.backgroundColor = "#fff7d6";
                cell.title = holidayName;
            }
        }

        loadTodos();
        loadHolidays();
    </script>
</body>
</html>
