<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="|${calendarTitle}のカレンダー|">カレンダー</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container calendar-container">
        <h1 class="page-title" th:text="${calendarTitle}">カレンダー</h1>

        <section class="calendar-card" th:attr="aria-label=${isWeekView ? '週間カレンダー' : '月間カレンダー'}">
            <nav class="calendar-navigation" aria-label="カレンダーの操作">
                <div class="calendar-navigation-group">
                    <a class="btn sub" th:unless="${isWeekView}" th:href="@{/calendar(year=${previousYear}, month=${previousMonth})}">前の月</a>
                    <a class="btn sub" th:unless="${isWeekView}" th:href="@{/calendar(year=${nextYear}, month=${nextMonth})}">次の月</a>
                    <a class="btn sub" th:if="${isWeekView}" th:href="@{/calendar(view='week', date=${previousWeekDate})}">前の週</a>
                    <a class="btn sub" th:if="${isWeekView}" th:href="@{/calendar(view='week', date=${nextWeekDate})}">次の週</a>
                </div>
                <div class="calendar-navigation-group">
                    <a class="btn sub" th:unless="${isWeekView}" th:href="@{/calendar(view='week', date=${weekReferenceDate})}">週表示</a>
                    <a class="btn sub" th:if="${isWeekView}" th:href="@{/calendar(year=${calendarYear}, month=${calendarMonth})}">月表示</a>
                    <a class="btn sub" th:href="@{/todos}">表で見る</a>
                    <a class="btn sub" th:href="@{/todos/new}">新規登録</a>
                </div>
            </nav>

            <div class="calendar-table-wrapper">
                <table class="calendar-table"
                    th:attr="data-from=${firstDate},data-to=${lastDate},data-view=${viewMode}">
                    <thead>
                        <tr>
                            <th scope="col">日</th>
                            <th scope="col">月</th>
                            <th scope="col">火</th>
                            <th scope="col">水</th>
                            <th scope="col">木</th>
                            <th scope="col">金</th>
                            <th scope="col">土</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="week : ${calendarWeeks}">
                            <td th:each="date : ${week}" th:attr="data-date=${date}">
                                <span class="calendar-date" th:if="${date != null}" th:text="${date.dayOfMonth}"></span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
    <script>
        async function loadTodos() {
            const calendarTable = document.querySelector(".calendar-table");
            // 表に付いている月初と月末を、APIの検索条件にそのまま使います。
            const from = calendarTable.dataset.from;
            const to = calendarTable.dataset.to;
            const params = new URLSearchParams({ from, to });

            const res = await fetch(`/api/todos?${params.toString()}`);
            if (!res.ok) {
                return;
            }

            const todos = await res.json();
            // data-dateがある升目だけを集めるため、月の外の空きマスは入りません。
            const cellsByDate = new Map(
                Array.from(
                    calendarTable.querySelectorAll("td[data-date]"),
                    cell => [cell.dataset.date, cell]
                )
            );
            const todosByDate = new Map();

            for (const todo of todos) {
                if (!cellsByDate.has(todo.dueDate)) {
                    continue;
                }

                const todosOnDate = todosByDate.get(todo.dueDate) ?? [];
                todosOnDate.push(todo);
                todosByDate.set(todo.dueDate, todosOnDate);
            }

            const today = new Date();
            // 時刻の違いを除き、日付だけで期限と今日を比べます。
            today.setHours(0, 0, 0, 0);

            for (const [date, todosOnDate] of todosByDate) {
                const cell = cellsByDate.get(date);

                // 週表示は全件、月表示はこれまでどおり先頭3件を升目に入れます。
                const visibleTodos = calendarTable.dataset.view === "week"
                    ? todosOnDate
                    : todosOnDate.slice(0, 3);

                for (const todo of visibleTodos) {
                    const title = document.createElement("a");
                    title.className = "link";
                    title.href = `/todos/${todo.id}/edit`;
                    title.style.display = "block";
                    // textContentを使い、やることの名前だけを文字として追加します。
                    title.textContent = todo.title;

                    const [year, month, day] = todo.dueDate.split("-").map(Number);
                    const dueDate = new Date(year, month - 1, day);
                    if (dueDate < today && todo.completed === false) {
                        title.style.color = "#dc2626";
                    }

                    cell.appendChild(title);
                }

                const hiddenCount = todosOnDate.length - visibleTodos.length;
                if (calendarTable.dataset.view === "month" && hiddenCount > 0) {
                    const more = document.createElement("div");
                    more.textContent = `ほか ${hiddenCount}件`;
                    cell.appendChild(more);
                }
            }
        }

        async function loadHolidays() {
            const calendarTable = document.querySelector(".calendar-table");
            // やることの取得と同じ月初・月末を、祝日の検索条件にも使います。
            const from = calendarTable.dataset.from;
            const to = calendarTable.dataset.to;
            const params = new URLSearchParams({ from, to });
            const cells = calendarTable.querySelectorAll("td[data-date]");

            for (const cell of cells) {
                // 年・月・日に分けて日付を作り、その日の曜日を調べます。
                const [year, month, day] = cell.dataset.date.split("-").map(Number);
                const dayOfWeek = new Date(year, month - 1, day).getDay();

                if (dayOfWeek === 6) {
                    cell.style.backgroundColor = "#eaf4ff";
                } else if (dayOfWeek === 0) {
                    cell.style.backgroundColor = "#fff0f3";
                }
            }

            const res = await fetch(`/api/holidays?${params.toString()}`);
            if (res.headers.has("X-Holidays-Unavailable")) {
                const message = document.createElement("p");
                message.textContent = "祝日を取れませんでした";
                document.body.prepend(message);
            }

            if (!res.ok) {
                return;
            }

            const holidays = await res.json();
            for (const [date, holidayName] of Object.entries(holidays)) {
                const cell = calendarTable.querySelector(`td[data-date="${date}"]`);
                if (!cell) {
                    continue;
                }

                // 祝日が土日と重なる場合は、祝日の背景色を優先します。
                cell.style.backgroundColor = "#fff7d6";
                cell.title = holidayName;
            }
        }

        async function loadWeather() {
            const calendarTable = document.querySelector(".calendar-table");
            const from = calendarTable.dataset.from;
            const to = calendarTable.dataset.to;
            const params = new URLSearchParams({ from, to });

            try {
                // ブラウザは外部サイトではなく、このアプリのAPIだけを呼び出します。
                const res = await fetch(`/api/weather?${params.toString()}`);
                if (!res.ok) {
                    return;
                }

                const weatherByDate = await res.json();
                for (const [date, weatherName] of Object.entries(weatherByDate)) {
                    const cell = calendarTable.querySelector(`td[data-date="${date}"]`);
                    if (!cell) {
                        continue;
                    }

                    const weather = document.createElement("div");
                    // 外部から受け取った値は、HTMLではなく文字として追加します。
                    weather.textContent = weatherName;
                    cell.appendChild(weather);
                }
            } catch (error) {
                // アプリのAPIを呼べない場合も、すでに表示済みのカレンダーはそのまま残します。
                return;
            }
        }

        loadTodos();
        loadHolidays();
        loadWeather();
    </script>
</body>
</html>
